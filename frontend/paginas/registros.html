<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYFILMES - Gestión de Media</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-module="media">
  <div class="app-container">
    
    <aside class="sidebar">
      <div>
        <div class="sidebar-header">
          <a href="../index.html" class="brand-logo">
            <i data-lucide="aperture" style="color: var(--primary-red);"></i> MYFILMES
          </a>
        </div>
        <div class="sidebar-section-title">ADMINISTRACIÓN</div>
        <ul class="sidebar-menu">
          <li class="sidebar-item"><a href="../index.html"><i data-lucide="layout-grid"></i> Resumen</a></li>
          <li class="sidebar-item active"><a href="./registros.html"><i data-lucide="film"></i> Media</a></li>
          <li class="sidebar-item"><a href="./formulario.html"><i data-lucide="tag"></i> Géneros</a></li>
          <li class="sidebar-item"><a href="./directores.html"><i data-lucide="user"></i> Directores</a></li>
          <li class="sidebar-item"><a href="./productoras.html"><i data-lucide="building"></i> Productoras</a></li>
          <li class="sidebar-item"><a href="./tipos.html"><i data-lucide="layers"></i> Tipos</a></li>
        </ul>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div>
          <span style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase;">PANEL / MEDIA</span>
          <h1 style="font-size: 1.5rem; font-weight: 700;">Gestión de producciones</h1>
        </div>
        <button class="btn btn-danger" id="open-modal-btn">
          <i data-lucide="plus"></i> Nuevo registro
        </button>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>SERIAL</th>
              <th>TÍTULO</th>
              <th>SINOPSIS</th>
              <th>AÑO DE ESTRENO</th>
              <th style="text-align: right;">ACCIONES</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- MODAL MEDIA -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <div>
          <span style="font-size: 0.7rem; color: var(--primary-red); text-transform: uppercase;">CREAR / EDITAR</span>
          <h3 style="font-size: 1.25rem; font-weight: 700;">Registro de Media</h3>
        </div>
        <button id="close-modal-btn" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="api-form">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem;">
          <div>
            <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">Serial</label>
            <input type="text" id="input-serial" placeholder="MOV-011" required style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;">
          </div>
          <div>
            <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">Año Estreno</label>
            <input type="number" id="input-anio_estreno" placeholder="2024" required style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;">
          </div>
        </div>

        <div style="margin-bottom: 0.75rem;">
          <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">Título</label>
          <input type="text" id="input-titulo" placeholder="Ej. Interstellar" required style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;">
        </div>

        <div style="margin-bottom: 0.75rem;">
          <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">Sinopsis</label>
          <textarea id="input-sinopsis" rows="2" placeholder="Resumen de la producción..." style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;"></textarea>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem;">
          <div>
            <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">URL</label>
            <input type="url" id="input-url" placeholder="https://..." style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;">
          </div>
          <div>
            <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">URL Imagen</label>
            <input type="url" id="input-imagen" placeholder="https://..." style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;">
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem;">
          <div>
            <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">Género ID</label>
            <input type="number" id="input-genero_id" placeholder="1" required style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;">
          </div>
          <div>
            <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">Director ID</label>
            <input type="number" id="input-director_id" placeholder="1" required style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;">
          </div>
          <div>
            <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">Productora ID</label>
            <input type="number" id="input-productora_id" placeholder="1" required style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;">
          </div>
          <div>
            <label style="display:block; font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.25rem;">Tipo ID</label>
            <input type="number" id="input-tipo_id" placeholder="1" required style="width:100%; padding:0.5rem; background:#0c0f12; border:1px solid var(--border-dark); color:#fff; border-radius:4px;">
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:1rem;">
          <button type="button" class="btn" id="cancel-btn" style="color:var(--text-muted);">Cancelar</button>
          <button type="submit" id="btn-submit" class="btn btn-danger"><i data-lucide="check"></i> Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script>lucide.createIcons();</script>
  <script src="../js/main.js"></script>
</body>
</html>
