<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYFILMES - Centro de Control</title>
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-module="resumen">
  <div class="app-container">
    
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <div>
        <div class="sidebar-header">
          <a href="./index.html" class="brand-logo">
            <i data-lucide="aperture" style="color: var(--primary-red);"></i> MYFILMES
          </a>
        </div>

        <div class="sidebar-section-title">ADMINISTRACIÓN</div>

        <ul class="sidebar-menu">
          <li class="sidebar-item active">
            <a href="./index.html"><i data-lucide="layout-grid"></i> Resumen</a>
          </li>
          <li class="sidebar-item">
            <a href="./paginas/registros.html"><i data-lucide="film"></i> Media</a>
          </li>
          <li class="sidebar-item">
            <a href="./paginas/formulario.html"><i data-lucide="tag"></i> Géneros</a>
          </li>
          <li class="sidebar-item">
            <a href="./paginas/directores.html"><i data-lucide="user"></i> Directores</a>
          </li>
          <li class="sidebar-item">
            <a href="./paginas/productoras.html"><i data-lucide="building"></i> Productoras</a>
          </li>
          <li class="sidebar-item">
            <a href="./paginas/tipos.html"><i data-lucide="layers"></i> Tipos</a>
          </li>
        </ul>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <div class="top-bar">
        <div>
          <span style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase;">PANEL / RESUMEN</span>
          <h1 style="font-size: 1.5rem; font-weight: 700;">Centro de control</h1>
        </div>

        <div class="search-container">
          <i data-lucide="search" size="16" class="search-icon"></i>
          <input type="text" id="search-catalog" class="search-input" placeholder="Buscar en el catálogo...">
        </div>
      </div>

      <!-- KPIS DINÁMICOS -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-value" id="kpi-media">0</div>
          <div class="kpi-label">Producciones</div>
          <div class="kpi-subtext">En catálogo</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value" id="kpi-generos">0</div>
          <div class="kpi-label">Géneros</div>
          <div class="kpi-subtext">Registrados</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value" id="kpi-directores">0</div>
          <div class="kpi-label">Directores</div>
          <div class="kpi-subtext">Registrados</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value" id="kpi-productoras">0</div>
          <div class="kpi-label">Productoras</div>
          <div class="kpi-subtext">Registradas</div>
        </div>
      </div>

      <!-- CATÁLOGO AUDIOVISUAL -->
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem;">Últimas producciones</h2>
      <div class="media-grid" id="media-grid"></div>
    </main>
  </div>

  <script>lucide.createIcons();</script>
  <script src="./js/main.js"></script>
</body>
</html>
